name: CI

on:
  push:
    branches-ignore: [codex/macos-terminal-probe]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/platform.yml
    with:
      os: ubuntu-latest
  macos:
    uses: ./.github/workflows/platform.yml
    with:
      os: macos-latest
