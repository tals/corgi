name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/platform.yml
    with:
      os: ubuntu-latest
  linux-arm64:
    uses: ./.github/workflows/platform.yml
    with:
      os: ubuntu-24.04-arm
  macos:
    uses: ./.github/workflows/platform.yml
    with:
      os: macos-latest
