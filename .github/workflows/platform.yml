name: Platform

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The native layer is built from the tracked files under native/, the compiler pin and
      # the flags in build.ts and below, so the same trees reuse the last build's output.
      - name: Native layer key
        id: native-key
        shell: bash
        run: echo "hash=$(git rev-parse HEAD:native HEAD:scripts/zig HEAD:build.ts HEAD:.github/workflows/platform.yml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - id: native
        uses: actions/cache@v6
        with:
          path: native/zig-out
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-key.outputs.hash }}
      # scripts/zig pins the compiler and downloads it into .tools when the cache misses.
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .tools/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/zig') }}
      - name: Install Zig
        if: steps.native.outputs.cache-hit != 'true'
        run: ./scripts/zig version
      # Zig doesn't retry a failed package download, and Ghostty's mirror sometimes resets.
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: native/zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/build.zig.zon') }}
      - run: bun install --frozen-lockfile
      - name: Build
        shell: bash
        env:
          NATIVE_CACHED: ${{ steps.native.outputs.cache-hit }}
        run: |
          # Build the way releases do, for the oldest supported target: integration jobs
          # may land on a CPU without the build machine's extensions.
          args=(--native-root "$PWD/native/zig-out" --outfile dist/corgi-test)
          if [ "$RUNNER_OS" = macOS ]; then
            # Newer SDKs' mach headers break Zig 0.16's translate-c; releases pin 26.2.
            sdk=$(ls -d /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.2.sdk | head -1)
            args+=(--target darwin-arm64 --sysroot "$sdk")
          elif [ "$RUNNER_ARCH" = ARM64 ]; then
            args+=(--target linux-arm64)
          else
            args+=(--target linux-x64)
          fi
          if [ "$NATIVE_CACHED" = true ]; then args+=(--no-native); fi
          bun build.ts --test --ci "${args[@]}"
      - name: Typecheck
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: bun typecheck.ts --ci
      - name: Unit tests
        run: bun test src
      - name: Restore integration timings
        uses: actions/cache/restore@v6
        with:
          path: .zig-cache/integration-timings/baseline
          key: integration-timings-v1-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: integration-timings-v1-${{ inputs.os }}-
      - name: Pack build
        run: |
          mkdir -p .zig-cache/integration-timings/baseline
          tar -czf build.tgz dist/corgi-test dist/corgi-test.build.json native/zig-out .zig-cache/integration-timings/baseline
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.os }}
          path: build.tgz
          retention-days: 3

  site:
    name: site translations and recordings
    if: inputs.os == 'ubuntu-latest'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.os }}
      - run: tar -xzf build.tgz
      - run: bun scripts/translations.ts check --site
      - run: bun tools/site_frames.ts --all-languages --check
      - run: bun test site
      - run: bun run landingpage:build

  integration:
    permissions:
      contents: read
      checks: write
    name: integration · ${{ matrix.shard }}/4
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install shells
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install fish; else sudo apt-get install -y fish zsh; fi
          # The image leaves zsh function folders group-writable, and compinit stops to ask about them.
          zsh -c 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.os }}
      - run: tar -xzf build.tgz
      - name: Integration tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORGI_TEST_CHECK_ID: ${{ job.check_run_id }}
        run: bun integration.ts --shard ${{ matrix.shard }}/4 --retry
      - name: Upload integration timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-timings-${{ inputs.os }}-${{ matrix.shard }}
          path: .zig-cache/integration-timings/current/*.json
          if-no-files-found: ignore
          retention-days: 3

  timings:
    name: save integration timings
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: integration-timings-${{ inputs.os }}-*
          path: .zig-cache/integration-timings/baseline
          merge-multiple: true
      - uses: actions/cache/save@v6
        with:
          path: .zig-cache/integration-timings/baseline
          key: integration-timings-v1-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
