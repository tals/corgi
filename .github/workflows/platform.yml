name: Platform

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Zig
        shell: bash
        run: |
          # scripts/zig finds the pinned compiler in .tools.
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) name=zig-aarch64-macos-0.17.0 sum=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a ;;
            Linux-ARM64) name=zig-aarch64-linux-0.17.0 sum=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
            *) name=zig-x86_64-linux-0.17.0 sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
          esac
          curl -fsSL --retry 3 -o zig.tar.xz "https://ziglang.org/download/0.17.0/$name.tar.xz"
          echo "$sum  zig.tar.xz" | shasum -a 256 -c -
          mkdir -p .tools && tar -xJf zig.tar.xz -C .tools && rm zig.tar.xz
          ./scripts/zig version
      # Zig doesn't retry a failed package download, and Ghostty's mirror sometimes resets.
      - uses: actions/cache@v6
        with:
          path: native/zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/build.zig.zon') }}
      - run: bun install --frozen-lockfile
      - name: Build
        shell: bash
        run: |
          # Build the way releases do, for the oldest supported target: integration jobs
          # may land on a CPU without the build machine's extensions.
          args=(--native-root "$PWD/native/zig-out" --outfile dist/corgi-test)
          if [ "$RUNNER_OS" = macOS ]; then
            # Newer SDKs' mach headers break Zig 0.16's translate-c; releases pin 26.2.
            sdk=$(ls -d /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.2.sdk | head -1)
            args+=(--target darwin-arm64 --sysroot "$sdk")
          elif [ "$RUNNER_ARCH" = ARM64 ]; then
            args+=(--target linux-arm64)
          else
            args+=(--target linux-x64)
          fi
          bun build.ts --test "${args[@]}"
      - name: Typecheck
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: bun typecheck.ts
      - name: Unit tests
        run: bun test src
      - name: Pack build
        run: tar -czf build.tgz dist/corgi-test dist/corgi-test.build.json native/zig-out
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.os }}
          path: build.tgz
          retention-days: 3

  integration:
    name: integration (${{ matrix.shard }}/4)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install shells
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install fish; else sudo apt-get install -y fish zsh; fi
          # The image leaves zsh function folders group-writable, and compinit stops to ask about them.
          zsh -c 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.os }}
      - run: tar -xzf build.tgz
      - name: Integration tests
        run: bun integration.ts --shard ${{ matrix.shard }}/4 --retry
