<div id="agent-options" aria-label="Agent list: dividers versus alternating row backgrounds">
  <style>
    #agent-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    #agent-options .option-label { margin-bottom: 10px; font: 500 14px/20px system-ui, sans-serif; color: light-dark(#32363d, #d9dde3); }
    #agent-options .terminal { background: #191c20; color: #dddfe3; padding: 16px 8px 22px; font: 20px/30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #agent-options .heading { padding: 0 8px 24px; font-weight: 500; }
    #agent-options .agent { display: grid; grid-template-columns: 30px minmax(0, 1fr); padding: 0 8px; position: relative; }
    #agent-options .active { color: #f4dfaa; }
    #agent-options .idle { color: #b4dba8; }
    #agent-options .second { display: block; color: #b7bcc5; }
    #agent-options .lines .agent:not(:last-child)::after { content: ''; position: absolute; height: 1px; bottom: 2px; left: 8px; right: 8px; background: #41464d; }
    #agent-options .bands .agent:nth-child(even) { background: #282d33; }
    @media(max-width: 640px) { #agent-options { grid-template-columns: 1fr; } }
  </style>
  <section>
    <div class="option-label">Full-width dividers</div>
    <div class="terminal lines">
      <div class="heading">agents</div>
      <div class="agents">
        <div class="agent"><span class="active" aria-label="Active">●</span><span>Commit pending<span class="second">changes in logical</span></span></div>
        <div class="agent"><span class="idle" aria-label="Idle">○</span><span>Show two-line agent<span class="second">summaries</span></span></div>
        <div class="agent"><span class="active" aria-label="Active">●</span><span>Fix checkpoint<span class="second">reload failure</span></span></div>
        <div class="agent"><span class="idle" aria-label="Idle">○</span><span>Summarize agent<span class="second">activity</span></span></div>
      </div>
    </div>
  </section>
  <section>
    <div class="option-label">Alternating row backgrounds</div>
    <div class="terminal bands">
      <div class="heading">agents</div>
      <div class="agents">
        <div class="agent"><span class="active" aria-label="Active">●</span><span>Commit pending<span class="second">changes in logical</span></span></div>
        <div class="agent"><span class="idle" aria-label="Idle">○</span><span>Show two-line agent<span class="second">summaries</span></span></div>
        <div class="agent"><span class="active" aria-label="Active">●</span><span>Fix checkpoint<span class="second">reload failure</span></span></div>
        <div class="agent"><span class="idle" aria-label="Idle">○</span><span>Summarize agent<span class="second">activity</span></span></div>
      </div>
    </div>
  </section>
</div>
